# Tests mit MariaDB; auf main und bei Versions-Tags (v1.2.3) zusätzlich das Docker-Image
# ghcr.io/<besitzer>/<repo> für amd64 und arm64. Pull Requests werden nur getestet.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: hangar_test
          MARIADB_USER: hangar
          MARIADB_PASSWORD: hangar
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: hangar
      DB_PASSWORD: hangar
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, pdo_sqlite, mbstring, curl, sodium, fileinfo
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find src bin public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpunit --no-coverage

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
