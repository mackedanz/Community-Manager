# Diese beiden gelten für den ganzen Server und dürfen nicht innerhalb von <VirtualHost> stehen.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Anfragen über 6 MB gar nicht erst annehmen (der größte Upload ist der Import mit 5 MB)
    LimitRequestBody 6291456

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Alles, was keine Datei ist, geht an den Front-Controller
        FallbackResource /index.php
    </Directory>

    # Statische Dateien dürfen lange gecacht werden (CSS/JS tragen keinen Hash, daher moderat)
    <FilesMatch "\.(css|js|png|ico)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
